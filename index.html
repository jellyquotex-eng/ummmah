<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe4">
<title>For Pakhi ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3efe4;--sky:#a8cbe6;--sky-d:#6fa3cb;--olive:#66742f;--olive-l:#8d9a55;--olive-d:#2f3a1b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--olive-d);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
.stage{position:fixed;inset:0;overflow:hidden}
#push,#cam{position:absolute;inset:0}
.layer{position:absolute;inset:-8%;will-change:transform}
#bg{background:radial-gradient(ellipse 85% 70% at 50% 38%,#f9f6ec 0%,#efebdd 48%,#d3e4ef 100%)}
#blobs .b{position:absolute;border-radius:50%;filter:blur(46px)}
#glow{background:radial-gradient(circle at 50% 52%,rgba(255,255,255,.95),transparent 46%);opacity:0}
#tint{background:radial-gradient(circle at 50% 50%,rgba(168,203,230,.85),rgba(168,203,230,0) 70%);opacity:0}
#rays{background:conic-gradient(from 195deg at 50% -12%,transparent 0 9%,rgba(255,255,255,.75) 13%,transparent 17% 29%,rgba(255,255,255,.55) 33%,transparent 37% 100%);filter:blur(14px);opacity:0}
.vwrap{position:absolute;height:64vh;aspect-ratio:1/2;will-change:transform;z-index:1;pointer-events:none}
.vwrap svg{width:100%;height:100%;overflow:visible}
#vl{left:-3vw;bottom:-4vh}#vr{right:-3vw;top:-4vh}#vr svg{transform:rotate(180deg)}
@media (max-aspect-ratio:1/1){.vwrap{height:50vh}}
.stem{fill:none;stroke:#78873b;stroke-width:1.5;stroke-linecap:round}
.leaf{fill:#7d8c43;stroke:rgba(47,58,27,.25);stroke-width:.4}
.leaf.ll{fill:#a7b36d}.leaf.lb{fill:#a8cbe6;stroke:rgba(70,120,160,.3)}
.bloom{fill:#e9f2f8;stroke:#6fa3cb;stroke-width:.9}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#vig{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(102,116,47,.22) 100%)}
.bar{position:absolute;left:0;right:0;height:8vh;background:#2b3318;z-index:5;pointer-events:none}
#bt{top:0;transform:translateY(-100%)}#bb{bottom:0;transform:translateY(100%)}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(9vh + env(safe-area-inset-top,0px)) 22px calc(9vh + env(safe-area-inset-bottom,0px));z-index:3;will-change:transform}
.scene.on{display:flex}
.ln{display:block;margin:.08em 0}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.16em .04em .34em;margin:-.16em 0 -.34em;position:relative}
.c{display:inline-block;will-change:transform,opacity,filter;white-space:pre}
.em{color:var(--olive);font-weight:500}
.ul{position:absolute;left:0;bottom:.02em;width:100%;height:auto;overflow:visible}
.ul path{fill:none;stroke:var(--sky-d);stroke-width:2.4;stroke-linecap:round}
.t{font-size:clamp(1.3rem,5.2vw,2.1rem);font-weight:400;font-style:italic;letter-spacing:.04em;line-height:1.5;max-width:20em;color:var(--olive-d)}
.msg{font-weight:400;font-style:italic;font-size:clamp(1.75rem,7.4vw,3.6rem);line-height:1.5;max-width:16em;color:var(--olive-d)}
.ask{font-size:clamp(2.3rem,10.5vw,4.8rem);font-style:italic;font-weight:400;line-height:1.15;color:var(--olive-d)}
.cap{margin-top:18px;font-size:clamp(.95rem,3.2vw,1.2rem);letter-spacing:.42em;text-transform:lowercase;color:var(--olive);font-weight:500}
svg.heart{width:clamp(150px,44vw,240px);height:auto;overflow:visible}
svg.heart .st{fill:none;stroke:var(--olive);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
svg.heart .r2{fill:none;stroke:var(--sky-d);stroke-width:1;stroke-dasharray:1 7;stroke-linecap:round;transform-box:fill-box;transform-origin:center}
.btns{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:clamp(26px,5vh,44px);opacity:0}
.btn{font:600 1.1rem/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em;border:0;cursor:pointer;padding:1.05rem 1.9rem;border-radius:999px;min-width:11.5rem;
 transform:translateY(var(--y,0)) scale(calc(var(--s,1)*var(--g,1)));transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s,background .5s}
.btn:hover{--y:-3px}.btn:active{--s:.95}
.btn:focus-visible,.mini:focus-visible,#begin:focus-visible,#mute:focus-visible{outline:2px solid var(--sky-d);outline-offset:4px}
#yes{color:#f9f6ec;background:linear-gradient(135deg,#7f8f3c,#56642a);box-shadow:0 16px 38px -14px rgba(86,100,42,.85),0 0 0 6px rgba(168,203,230,.35),inset 0 1px 0 rgba(255,255,255,.3)}
#yes:hover{box-shadow:0 22px 46px -14px rgba(86,100,42,.95),0 0 0 9px rgba(168,203,230,.45),inset 0 1px 0 rgba(255,255,255,.35)}
#no{color:var(--olive-d);background:rgba(249,246,236,.7);border:1px solid rgba(102,116,47,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 12px 28px -16px rgba(47,58,27,.5)}
#hint{min-height:2.8em;margin-top:22px;font-size:1.25rem;font-style:italic;color:var(--olive);opacity:0;max-width:20em;font-weight:500}
.mini{background:none;border:0;color:rgba(47,58,27,.6);font:italic 1.05rem 'Cormorant Garamond',serif;cursor:pointer;text-decoration:underline;text-underline-offset:4px;margin-top:30px;opacity:0;padding:8px}
#gate{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(ellipse at 50% 40%,#f9f6ec,#e2ebee);text-align:center;padding:24px}
#gate p{font-style:italic;font-size:clamp(1.3rem,4.8vw,1.9rem);letter-spacing:.04em;color:var(--olive-d)}
#begin{background:rgba(255,255,255,.4);border:1px solid var(--olive);color:var(--olive-d);padding:1rem 2.4rem;border-radius:999px;font:600 1.05rem 'Cormorant Garamond',serif;letter-spacing:.22em;cursor:pointer;transition:background .5s,transform .5s cubic-bezier(.22,1,.36,1)}
#begin:hover{background:rgba(168,203,230,.5);transform:scale(1.04)}
#mute{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 8px);right:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(243,239,228,.4);background:rgba(243,239,228,.08);color:#f3efe4;cursor:pointer;display:none;align-items:center;justify-content:center;transition:transform .4s cubic-bezier(.22,1,.36,1)}
#mute:hover{transform:scale(1.1)}
#mute svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.who{display:flex;flex-direction:column;align-items:center;gap:14px}
.who .lbl{font-style:italic;font-size:1.25rem;color:var(--olive)}
#nameIn{width:min(18em,80vw);text-align:center;font:500 italic 1.6rem 'Cormorant Garamond',Georgia,serif;font-size:max(16px,1.6rem);color:var(--olive-d);background:rgba(255,255,255,.55);border:0;border-bottom:2px solid var(--olive);border-radius:14px 14px 0 0;padding:.6rem 1rem;outline:none;transition:background .4s,border-color .4s,box-shadow .4s}
#nameIn::placeholder{color:rgba(47,58,27,.4)}
#nameIn:focus{background:rgba(255,255,255,.85);border-bottom-color:var(--sky-d);box-shadow:0 10px 30px -14px rgba(111,163,203,.8)}
#chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:22em;min-height:2.6rem}
.chip{font:600 1.15rem 'Cormorant Garamond',Georgia,serif;padding:.6rem 1.3rem;border-radius:999px;border:1px solid rgba(102,116,47,.45);background:rgba(255,255,255,.55);color:var(--olive-d);cursor:pointer;transition:background .4s,color .4s,box-shadow .4s,transform .4s cubic-bezier(.22,1,.36,1)}
.chip:hover{transform:translateY(-2px)}
.chip[aria-checked=true]{background:var(--olive);color:#f9f6ec;border-color:var(--olive);box-shadow:0 0 0 5px rgba(168,203,230,.5)}
.chip:focus-visible{outline:2px solid var(--sky-d);outline-offset:3px}
#begin:disabled{opacity:.35;cursor:not-allowed;transform:none}
.wish1{font-size:clamp(3.6rem,18vw,7.6rem);font-style:italic;font-weight:500;line-height:1.05;color:var(--olive)}
.wish2{font-size:clamp(1.7rem,7vw,3.2rem);font-style:italic;font-weight:400;line-height:1.5;color:var(--olive-d);margin-top:.2em}
#wl{width:clamp(130px,40vw,230px);height:auto;margin:6px 0 10px;overflow:visible}
#wl path{fill:none;stroke:var(--sky-d);stroke-width:2.2;stroke-linecap:round}
.kiss{margin-top:18px;font-size:clamp(1.6rem,6.6vw,2.8rem);font-style:italic;font-weight:500;color:var(--olive);line-height:1.3}
#admin{position:fixed;inset:0;z-index:100;background:rgba(243,239,228,.98);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 40px;color:var(--olive-d);font-size:1.1rem}
#admin[hidden]{display:none}
.ad-wrap{max-width:720px;margin:0 auto}
.ad-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
.ad-head h2{font-size:2.1rem;font-style:italic;font-weight:500}
.ad-btn{font:600 1.05rem 'Cormorant Garamond',Georgia,serif;border:1px solid rgba(102,116,47,.5);background:rgba(255,255,255,.7);color:var(--olive-d);border-radius:999px;padding:.55rem 1.2rem;cursor:pointer}
.ad-btn:hover{background:rgba(168,203,230,.5)}
.ad-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.ad-stat{background:rgba(168,203,230,.3);border:1px solid rgba(102,116,47,.2);border-radius:16px;padding:10px 12px;text-align:center}
.ad-stat b{display:block;font-size:1.9rem;font-weight:600;color:var(--olive)}
.ad-box{border:1px solid rgba(102,116,47,.25);background:rgba(255,255,255,.55);border-radius:18px;padding:14px 16px;margin-bottom:18px}
.ad-box h3{font-size:1.2rem;font-weight:600;margin-bottom:10px}
.ad-add{display:flex;gap:8px;margin-bottom:10px}
.ad-add input{flex:1;min-width:0;font:500 1.1rem 'Cormorant Garamond',Georgia,serif;font-size:max(16px,1.1rem);padding:.55rem 1rem;border-radius:999px;border:1px solid rgba(102,116,47,.4);background:#fffdf6;color:var(--olive-d)}
#ad-chips{display:flex;flex-wrap:wrap;gap:8px}
.ad-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(141,154,85,.22);border-radius:999px;padding:.3rem .5rem .3rem 1rem;font-weight:600}
.ad-chip button{border:0;background:rgba(47,58,27,.12);border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--olive-d);line-height:1}
.ad-item{border:1px solid rgba(102,116,47,.25);background:rgba(255,255,255,.6);border-radius:18px;padding:16px;margin-bottom:12px}
.ad-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ad-top h3{font-size:1.6rem;font-weight:600;font-style:italic}
.badge{font-weight:600;font-size:1rem;padding:.3rem .9rem;border-radius:999px;white-space:nowrap}
.badge.yes{background:var(--olive);color:#f9f6ec}.badge.nope{background:var(--sky);color:var(--olive-d)}.badge.wait{background:rgba(47,58,27,.1);color:rgba(47,58,27,.7)}
.ad-row{display:flex;gap:12px;padding:5px 0;border-top:1px dashed rgba(102,116,47,.2)}
.ad-row .k{flex:0 0 7.2em;color:var(--olive);font-weight:600}.ad-row .v{flex:1;word-break:break-word}
.ad-del{margin-top:10px;font:600 .95rem 'Cormorant Garamond',serif;background:none;border:0;color:rgba(47,58,27,.55);text-decoration:underline;cursor:pointer;padding:4px 0}
.ad-empty,#ad-msg{font-style:italic;color:var(--olive);padding:8px 0}
@media (max-width:480px){.ad-stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.btn,#begin,#mute,.chip{transition:none}}
#rt,#rt2{font-size:clamp(1.35rem,5.2vw,2.5rem)}
#hand{position:relative;z-index:1;height:clamp(190px,42vh,340px);aspect-ratio:240/330;width:auto;overflow:visible}
.rp{transform-box:fill-box;transform-origin:center}
.bf{position:absolute;left:0;top:0;width:34px;height:28px;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div class="stage">
  <div id="push"><div id="cam">
    <div class="layer" id="bg"></div>
    <div class="layer" id="blobs"><div class="b" id="b1"></div><div class="b" id="b2"></div><div class="b" id="b3"></div></div>
    <div class="layer" id="tint"></div>
    <div class="layer" id="glow"></div>
    <div class="layer" id="rays"></div>
    <div class="vwrap" id="vl"><svg viewBox="0 0 200 400" aria-hidden="true"></svg></div>
    <div class="vwrap" id="vr"><svg viewBox="0 0 200 400" aria-hidden="true"></svg></div>
    <canvas id="fx"></canvas>
  </div></div>
  <div id="vig"></div>
  <div class="bar" id="bt"></div><div class="bar" id="bb"></div>

  <section class="scene" id="intro">
    <svg class="heart" id="hs" viewBox="0 0 200 200" style="display:none" aria-hidden="true">
      <circle class="st" id="r1" cx="100" cy="100" r="92"/>
      <circle class="r2" id="r2" cx="100" cy="100" r="81"/>
      <g transform="translate(50,54)"><path class="st" id="hp" d="M50 88C12 58 4 34 18 20C30 8 46 14 50 28C54 14 70 8 82 20C96 34 88 58 50 88Z"/></g>
    </svg>
    <p class="cap" id="cap"></p>
    <p class="t" id="it"></p>
  </section>

  <section class="scene" id="msgS"><p class="msg" id="msg" aria-label="tmk aro ekbar mone korai dei, valobasle kintu biye korte hoi."></p></section>

  <section class="scene" id="wishS">
    <h2 class="wish1" id="w1"></h2>
    <svg id="wl" viewBox="0 0 200 20" aria-hidden="true"><path id="wlp" d="M6 12C40 2 70 20 100 10S160 2 194 12"/></svg>
    <p class="wish2" id="w2"></p>
  </section>

  <section class="scene" id="askS">
    <h1 class="ask" id="ask"></h1>
    <div class="btns" id="btns">
      <button class="btn" id="yes" type="button">Absolutely Yes ❤️</button>
      <button class="btn" id="no" type="button">Nope 🙈</button>
    </div>
    <p id="hint" aria-live="polite"></p>
  </section>

  <section class="scene" id="yesS">
    <svg class="heart" id="hs2" viewBox="0 0 100 100" aria-hidden="true" style="width:clamp(90px,26vw,150px);margin-bottom:26px"><path class="st" id="hp2" d="M50 88C12 58 4 34 18 20C30 8 46 14 50 28C54 14 70 8 82 20C96 34 88 58 50 88Z"/></svg>
    <h2 class="ask" id="ys" style="font-size:clamp(1.9rem,8vw,3.6rem)"></h2>
    <p class="kiss" id="kiss" aria-live="polite"></p>
  </section>

  <section class="scene" id="ringS">
    <svg id="fl" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none"></svg>
    <div id="rtw" style="position:relative;z-index:1;margin-bottom:10px">
      <p class="msg" id="rt"></p>
      <p class="msg" id="rt2" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"></p>
    </div>
    <svg id="hand" viewBox="0 0 240 330" aria-hidden="true">
      <defs>
        <linearGradient id="sk" gradientUnits="userSpaceOnUse" x1="40" y1="30" x2="210" y2="330"><stop offset="0" stop-color="#fbe3cf"/><stop offset=".5" stop-color="#f0c7a6"/><stop offset="1" stop-color="#dba788"/></linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".45" stop-color="#e6b73f"/><stop offset="1" stop-color="#9c7014"/></linearGradient>
        <linearGradient id="dia" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d4ecfc"/><stop offset="1" stop-color="#7db8e3"/></linearGradient>
        <radialGradient id="halog"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".5" stop-color="#cfe6f5" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
        <linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="0" y1="255" x2="0" y2="326"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
        <mask id="fade" maskUnits="userSpaceOnUse" x="-300" y="-500" width="840" height="1000"><rect x="-300" y="-500" width="840" height="1000" fill="url(#fg)"/></mask>
        <g id="hshape">
          <path d="M52 165C44 205 60 238 72 266L74 340L152 340L156 266C172 238 184 198 178 165Z"/>
          <path transform="translate(66 175) rotate(-9)" d="M-13 0L-11 -73A11 11 0 0 1 11 -73L13 0Z"/>
          <path transform="translate(96 175) rotate(-3)" d="M-14 0L-11.5 -106.5A11.5 11.5 0 0 1 11.5 -106.5L14 0Z"/>
          <path transform="translate(127 173) rotate(1)" d="M-14.5 0L-12 -116A12 12 0 0 1 12 -116L14.5 0Z"/>
          <path transform="translate(158 176) rotate(7)" d="M-14 0L-11.5 -100.5A11.5 11.5 0 0 1 11.5 -100.5L14 0Z"/>
          <path transform="translate(172 254) rotate(36)" d="M-17 0L-13 -79A13 13 0 0 1 13 -79L17 0Z"/>
        </g>
      </defs>
      <circle id="halo" cx="94" cy="130" r="82" fill="url(#halog)" opacity="0" style="transform-box:fill-box;transform-origin:center"/>
      <g mask="url(#fade)">
        <use href="#hshape" fill="none" stroke="rgba(120,72,48,.6)" stroke-width="3.4" stroke-linejoin="round"/>
        <use href="#hshape" fill="url(#sk)"/>
        <g fill="none" stroke="rgba(150,90,60,.2)" stroke-width="1.4" stroke-linecap="round">
          <path d="M96 190C95 212 93 234 90 260"/><path d="M127 188C127 212 128 234 126 260"/><path d="M158 192C157 212 154 234 150 258"/>
          <path d="M70 230C80 244 100 252 120 252" stroke-opacity=".5"/>
        </g>
        <g transform="translate(66 175) rotate(-9)"><g fill="none" stroke="rgba(150,90,60,.4)" stroke-width="1.2" stroke-linecap="round"><path d="M-6 -34Q0 -31 6 -34"/><path d="M-5 -37Q0 -35 5 -37"/><path d="M-5 -58Q0 -56 5 -58"/></g><rect x="-6.5" y="-81" width="13" height="13" rx="5.5" fill="#fbe6df" stroke="rgba(150,90,60,.4)" stroke-width="1"/><rect x="-3.5" y="-78" width="4" height="6" rx="2" fill="#fff" opacity=".6"/></g>
        <g transform="translate(127 173) rotate(1)"><g fill="none" stroke="rgba(150,90,60,.4)" stroke-width="1.2" stroke-linecap="round"><path d="M-7 -58Q0 -55 7 -58"/><path d="M-6 -61Q0 -59 6 -61"/><path d="M-6 -92Q0 -90 6 -92"/></g><rect x="-7.5" y="-125" width="15" height="16" rx="6.5" fill="#fbe6df" stroke="rgba(150,90,60,.4)" stroke-width="1"/><rect x="-4" y="-122" width="4.5" height="7" rx="2" fill="#fff" opacity=".6"/></g>
        <g transform="translate(158 176) rotate(7)"><g fill="none" stroke="rgba(150,90,60,.4)" stroke-width="1.2" stroke-linecap="round"><path d="M-7 -52Q0 -49 7 -52"/><path d="M-6 -55Q0 -53 6 -55"/><path d="M-6 -82Q0 -80 6 -82"/></g><rect x="-7" y="-109" width="14" height="15" rx="6" fill="#fbe6df" stroke="rgba(150,90,60,.4)" stroke-width="1"/><rect x="-4" y="-106" width="4" height="6" rx="2" fill="#fff" opacity=".6"/></g>
        <g transform="translate(172 254) rotate(36)"><g fill="none" stroke="rgba(150,90,60,.4)" stroke-width="1.2" stroke-linecap="round"><path d="M-8 -42Q0 -39 8 -42"/><path d="M-7 -45Q0 -43 7 -45"/></g><rect x="-8" y="-87" width="16" height="16" rx="7" fill="#fbe6df" stroke="rgba(150,90,60,.4)" stroke-width="1"/><rect x="-4.5" y="-84" width="4.5" height="7" rx="2" fill="#fff" opacity=".6"/></g>
        <g transform="translate(96 175) rotate(-3)">
          <g fill="none" stroke="rgba(150,90,60,.4)" stroke-width="1.2" stroke-linecap="round"><path d="M-6 -62Q0 -59 6 -62"/><path d="M-5 -65Q0 -63 5 -65"/><path d="M-5 -88Q0 -86 5 -88"/></g>
          <rect x="-7.5" y="-115" width="15" height="15" rx="6.5" fill="#fbe6df" stroke="rgba(150,90,60,.4)" stroke-width="1"/><rect x="-4" y="-112" width="4.5" height="6" rx="2" fill="#fff" opacity=".6"/>
          <circle class="rp" cx="0" cy="-45" r="9" fill="none" stroke="#f0cf6a" stroke-width="1.6" opacity="0"/>

async function deviceInfo(){

  try{const d=navigator.userAgentData;if(d&&d.getHighEntropyValues){const h=await d.getHighEntropyValues(['model','platform','platformVersion']);model=h.model||'';platform=[h.platform,h.platformVersion].filter(Boolean).join(' ');}}catch(e){}
  if(model.length<2){model='';const m=ua.match(/Android[^;]*;\s*([^;)]+?)\s*(?:Build|\))/);if(m&&m[1].length>1)model=m[1];}
  if(!model){model=/iPhone/.test(ua)?'iPhone':/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)?'iPad':/Windows/.test(ua)?'Windows PC':/Macintosh/.test(ua)?'Mac':/Android/.test(ua)?'Android phone':/Linux/.test(ua)?'Linux PC':'Unknown';}
  if(!platform){const a=ua.match(/Android ([\d.]+)/),i=ua.match(/OS ([\d_]+) like Mac/);platform=a?'Android '+a[1]:i?'iOS '+i[1].replace(/_/g,'.'):/Windows/.test(ua)?'Windows':/Mac/.test(ua)?'macOS':/Linux/.test(ua)?'Linux':'';}

}

    const c=el('article','ad-item'),top=el('div','ad-top');top.appendChild(el('h3','',r.name||'Unknown'));
    const b=r.answer==='yes'?['Agreed ❤️','yes']:r.answer==='nope'?['Nope 🙈','nope']:['Not answered yet','wait'];
    top.appendChild(el('span','badge '+b[1],b[0]));c.appendChild(top);
    const d=r.device||{};
    [['Device',d.model],['System',[d.platform,d.browser].filter(Boolean).join(' / ')],['Screen',d.screen],['Opened',fmt(r.enteredAt)],['Last answer',r.answerAt?fmt(r.answerAt):'—'],['Nope taps',r.nopeCount||0]].forEach(([k,v])=>{const row=el('div','ad-row');row.appendChild(el('span','k',k));row.appendChild(el('span','v',val(v)));c.appendChild(row);});
    const del=el('button','ad-del','Delete this entry');del.type='button';del.onclick=()=>{if(confirm('Delete '+(r.name||'this entry')+'?'))FB.remove(r.id);};c.appendChild(del);
    list.appendChild(c);
  });
}
const denied=()=>adMsg('Could not read the database. Check the Realtime Database rules in Firebase (see notes).');
function openAdmin(){
  if(!adm.hidden)return;adm.hidden=false;
  if(!window.FB){$('#ad-list').textContent='';adMsg('Firebase is not connected. Open the site over the internet and try again.');return;}
  unW=FB.watch(renderRows,denied);
}
function closeAdmin(){adm.hidden=true;if(unW)unW();unW=null;}
$('#ad-close').onclick=closeAdmin;
let lastP=0;
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!adm.hidden){closeAdmin();return;}
  if(e.key.toLowerCase()!=='p'||e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName||''))return;
  const n=Date.now();if(n-lastP<450){lastP=0;adm.hidden?openAdmin():closeAdmin();}else lastP=n;
});
let taps=[];
addEventListener('pointerdown',e=>{if(e.clientX>70||e.clientY>70)return;const n=Date.now();taps=taps.filter(t=>n-t<3000);taps.push(n);if(taps.length>=5){taps=[];openAdmin();}});

$('#begin').onclick=()=>{if(!myName)return;$('#begin').disabled=true;startSong();logEntry();run();};
})();
</script>
</body>
</html>
