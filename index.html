<style>
:root{--paper:#f3efe4;--sky:#a8cbe6;--skyd:#6fa3cb;--olive:#66742f;--oliveD:#2f3a1b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--oliveD);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 85% 70% at 50% 38%,#f9f6ec,#efebdd 48%,#d3e4ef)}
.blob{position:absolute;border-radius:50%;filter:blur(46px)}
#b1{width:62vmax;height:62vmax;background:rgba(168,203,230,.75);left:8%;top:48%}
#b2{width:50vmax;height:50vmax;background:rgba(141,154,85,.4);left:62%;top:-6%}
#b3{width:40vmax;height:40vmax;background:rgba(255,255,255,.9);left:36%;top:30%}
.vw{position:absolute;height:60vh;aspect-ratio:1/2;pointer-events:none;z-index:1}
.vw svg{width:100%;height:100%;overflow:visible}
#vl{left:-3vw;bottom:-4vh}#vr{right:-3vw;top:-4vh}#vr svg{transform:rotate(180deg)}
.stem{fill:none;stroke:#78873b;stroke-width:1.5;stroke-linecap:round}
.leaf{fill:#7d8c43}.leaf.b{fill:#a8cbe6}.leaf.l{fill:#a7b36d}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(40px + env(safe-area-inset-top,0px)) 22px calc(40px + env(safe-area-inset-bottom,0px));z-index:3}
.scene.on{display:flex}
.ln{display:block;margin:.08em 0}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.16em .04em .34em;margin:-.16em 0 -.34em;position:relative}
.c{display:inline-block;white-space:pre}
.em{color:var(--olive);font-weight:500}
.ul{position:absolute;left:0;bottom:.02em;width:100%;height:auto;overflow:visible}
.ul path{fill:none;stroke:var(--skyd);stroke-width:2.4;stroke-linecap:round}
.t,.msg,.ask{font-style:italic;color:var(--oliveD)}
.t{font-size:clamp(1.3rem,5.2vw,2.1rem);letter-spacing:.04em;line-height:1.5;max-width:20em}

.cap{margin-top:18px;font-size:clamp(.95rem,3.2vw,1.2rem);letter-spacing:.42em;text-transform:lowercase;color:var(--olive);font-weight:500}

svg.heart .st{fill:none;stroke:var(--olive);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:clamp(26px,5vh,44px);opacity:0}
.btn{font:600 1.1rem/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em;border:0;cursor:pointer;padding:1.05rem 1.9rem;border-radius:999px;min-width:11.5rem;transform:scale(var(--g,1));transition:transform .5s cubic-bezier(.22,1,.36,1)}
.btn:active{transform:scale(.95)}
#yes{color:#f9f6ec;background:linear-gradient(135deg,#7f8f3c,#56642a);box-shadow:0 16px 38px -14px rgba(86,100,42,.85),0 0 0 6px rgba(168,203,230,.35)}
#no{color:var(--oliveD);background:rgba(249,246,236,.7);border:1px solid rgba(102,116,47,.4);box-shadow:0 12px 28px -16px rgba(47,58,27,.5)}
#hint{min-height:2.8em;margin-top:22px;font-size:1.25rem;font-style:italic;color:var(--olive);opacity:0;max-width:20em;font-weight:500}
.mini{background:none;border:0;color:rgba(47,58,27,.6);font:italic 1.05rem 'Cormorant Garamond',serif;cursor:pointer;text-decoration:underline;text-underline-offset:4px;margin-top:12px;opacity:0;padding:8px}
.kiss{margin-top:18px;font-size:clamp(1.6rem,6.6vw,2.8rem);font-style:italic;font-weight:500;color:var(--olive);line-height:1.3}
#rg{width:clamp(140px,38vw,220px);height:auto;overflow:visible;margin-top:8px}
#rt{font-size:clamp(1.35rem,5.2vw,2.5rem)}
#gate{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(ellipse at 50% 40%,#f9f6ec,#e2ebee);text-align:center;padding:24px}
#gate p{font-style:italic;font-size:clamp(1.3rem,4.8vw,1.9rem);letter-spacing:.04em}
.lbl{font-style:italic;font-size:1.25rem;color:var(--olive);display:block;margin-bottom:12px}
#nameIn{width:min(18em,80vw);text-align:center;font:500 italic 1.6rem 'Cormorant Garamond',Georgia,serif;font-size:max(16px,1.6rem);color:var(--oliveD);background:rgba(255,255,255,.6);border:0;border-bottom:2px solid var(--olive);border-radius:14px 14px 0 0;padding:.6rem 1rem;outline:none}
#nameIn::placeholder{color:rgba(47,58,27,.4)}
#begin{background:rgba(255,255,255,.4);border:1px solid var(--olive);color:var(--oliveD);padding:1rem 2.4rem;border-radius:999px;font:600 1.05rem 'Cormorant Garamond',serif;letter-spacing:.22em;cursor:pointer}
#begin:disabled{opacity:.35;cursor:not-allowed}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',EASE='cubic-bezier(.22,1,.36,1)';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,T=ms=>RM?Math.min(ms,200):ms;
const sleep=ms=>new Promise(r=>setTimeout(r,T(ms)));
const an=(el,kf,d,o={})=>el.animate(kf,{duration:T(d),easing:o.e||EASE,delay:o.delay?T(o.delay):0,fill:'both'}).finished;
const clearAn=el=>el.getAnimations().forEach(a=>a.cancel()),rnd=(a,b)=>a+Math.random()*(b-a);
const seg=w=>window.Intl&&Intl.Segmenter?[...new Intl.Segmenter().segment(w)].map(s=>s.segment):[...w];
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};

/* ---------- Text: per-character masked reveal ---------- */
function build(el,text,o={}){
  el.textContent='';let t=0;const items=[],ems=[];
  text.split('\n').forEach(ln=>{
    const line=document.createElement('span');line.className='ln';
    ln.split(' ').forEach(w=>{
      const ws=document.createElement('span');ws.className='w';
      if(o.em&&o.em.some(e=>w.includes(e))){ws.classList.add('em');const u=mk('svg',{class:'ul',viewBox:'0 0 100 10'}),p=mk('path',{d:'M2 6C18 1 32 9 50 5S82 2 98 6'});u.appendChild(p);ws.appendChild(u);ems.push(p);}
      seg(w).forEach(ch=>{const c=document.createElement('span');c.className='c';c.textContent=ch;ws.appendChild(c);items.push([c,t]);t+=o.cs||46;});
      t+=o.gap||120;line.appendChild(ws);line.appendChild(document.createTextNode(' '));
    });
    t+=o.lb||320;el.appendChild(line);
  });
  return{items,ems,total:t};
}
function reveal(b,dur=1200,from='translateY(112%) rotate(7deg) scale(.9)'){
  b.items.forEach(([n,d])=>n.animate([{transform:from,opacity:0,filter:'blur(10px)'},{transform:'none',opacity:1,filter:'blur(0)'}],{duration:T(dur),delay:T(d),easing:EASE,fill:'both'}));
  return sleep(b.total+dur);
}
function wave(b){if(RM)return;b.items.forEach(([n],i)=>n.animate([{transform:'translateY(0)'},{transform:'translateY(-3px)'},{transform:'translateY(0)'}],{duration:3600,delay:i*110,iterations:Infinity,easing:'ease-in-out'}));}
const show=s=>{s.classList.add('on');return an(s,[{opacity:0},{opacity:1}],900,{e:'ease-out'})};
const hide=async s=>{await an(s,[{opacity:1},{opacity:0}],1100,{e:'ease-in'});s.classList.remove('on');clearAn(s)};
const glow=(el,d)=>el.animate([{filter:'drop-shadow(0 0 32px rgba(168,203,230,1))'},{filter:'drop-shadow(0 0 8px rgba(168,203,230,.2))'}],{duration:T(d),easing:'ease-out',fill:'both'});
const draw=(p,d)=>{const l=p.getTotalLength();p.style.strokeDasharray=l;return an(p,[{strokeDashoffset:l},{strokeDashoffset:0}],d,{e:'cubic-bezier(.65,0,.35,1)'});};

/* ---------- Music (same mp3 files, same folder as this html) ---------- */
const mkA=(s,l)=>{const a=new Audio(s);a.loop=!!l;a.preload='auto';return a;};
const song=mkA('ssstik.io_1793526595387.mp3',1),nopeSong=mkA('ssstik.io_1793527082095.mp3'),yesSong=mkA('ssstik.io_1793528600492.mp3',1);
song.volume=0;let songOn=0,nopeOn=0,yesOn=0,actx=null,vt;
function boost(){ /* louder than a normal <audio>: gain + soft limiter */
  if(location.protocol==='file:')return;
  try{if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();const lim=actx.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=12;lim.ratio.value=10;lim.attack.value=.003;lim.release.value=.2;const g=actx.createGain();g.gain.value=2.6;g.connect(lim);lim.connect(actx.destination);[song,nopeSong,yesSong].forEach(a=>actx.createMediaElementSource(a).connect(g));}
    if(actx.state==='suspended')actx.resume();}catch(e){}
}
function fade(v,ms){clearInterval(vt);const a=song.volume,t0=performance.now();vt=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);try{song.volume=Math.max(0,Math.min(1,a+(v-a)*k));}catch(e){}if(k>=1)clearInterval(vt);},50);}
function startSong(){boost();song.play().then(()=>{songOn=1;fade(1,3500);}).catch(()=>{});}
function resumeMain(){if(!songOn||yesOn||nopeOn)return;song.volume=0;song.play().then(()=>fade(1,1800)).catch(()=>{});}
function playNope(){if(nopeOn)return;boost();nopeOn=1;song.pause();nopeSong.currentTime=0;nopeSong.volume=1;nopeSong.play().catch(()=>{nopeOn=0;resumeMain();});}
nopeSong.addEventListener('ended',()=>{nopeOn=0;resumeMain();});
function playYes(){boost();clearInterval(vt);song.pause();nopeSong.pause();nopeOn=0;yesOn=1;yesSong.currentTime=0;yesSong.volume=1;yesSong.play().catch(()=>{});}
function stopYes(){yesOn=0;yesSong.pause();yesSong.currentTime=0;resumeMain();}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){song.pause();nopeSong.pause();yesSong.pause();}
  else if(yesOn)yesSong.play().catch(()=>{});else if(nopeOn)nopeSong.play().catch(()=>{});else if(songOn)song.play().catch(()=>{});
});

/* ---------- Canvas: motes, leaves, hearts, sparkles, petals ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,DPR;
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
size();addEventListener('resize',size);
const motes=RM?[]:Array.from({length:28},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.8,2),vy:rnd(-.16,-.04),a:rnd(.25,.6),p:rnd(0,6.28),c:Math.random()<.5?'102,116,47':'111,163,203'}));
const LC=['#7d8c43','#a7b36d','#8fbbdc'],HC=['#8fbbdc','#6fa3cb','#7d8c43','#a7b36d'],PC=['#f7c6d0','#f4a8b8','#ffffff','#ffd98a','#c9b8e8','#a8cbe6'];
const newLeaf=init=>({x:rnd(-20,W),y:init?rnd(0,H):-20,s:rnd(5,10),vy:rnd(.25,.6),vx:rnd(.15,.45),rot:rnd(0,6.28),vr:rnd(-.02,.02),c:LC[Math.floor(rnd(0,3))],a:rnd(.45,.85),p:rnd(0,6.28)});
const lv=RM?[]:Array.from({length:12},()=>newLeaf(true));
const fx=[];let ambient=false,lastSpawn=0;
function heartPath(s){cx.beginPath();cx.moveTo(0,s*.38);cx.bezierCurveTo(-s*1.05,-s*.25,-s*.6,-s*.95,0,-s*.42);cx.bezierCurveTo(s*.6,-s*.95,s*1.05,-s*.25,0,s*.38);cx.closePath();}
function starPath(s){cx.beginPath();cx.moveTo(0,-s);cx.quadraticCurveTo(0,0,s,0);cx.quadraticCurveTo(0,0,0,s);cx.quadraticCurveTo(0,0,-s,0);cx.quadraticCurveTo(0,0,0,-s);cx.closePath();}
function sparkle(x,y,n,sp){if(RM)n=Math.min(n,4);for(let i=0;i<n;i++)fx.push({shape:'star',x:x+rnd(-sp,sp),y:y+rnd(-sp*.6,sp*.6),vx:rnd(-.3,.3),vy:rnd(-.5,-.1),g:0,s:rnd(5,13),a:1,life:rnd(70,120),age:Math.floor(rnd(0,20)),rot:0,c:Math.random()<.5?'#6fa3cb':'#8d9a55',drag:.99});}
function burst(){for(let i=0;i<(RM?24:120);i++){const a=rnd(0,6.283),v=rnd(2,11)*(Math.random()<.3?1.5:1);fx.push({x:W/2,y:H*.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.09,s:rnd(5,17),a:1,life:rnd(90,170),age:0,rot:rnd(-.5,.5),c:HC[Math.floor(rnd(0,4))],drag:.985});}}
function rain(){for(let i=0;i<(RM?10:60);i++)fx.push({x:rnd(0,W),y:H+rnd(10,H*.8),vx:rnd(-.3,.3),vy:rnd(-2.6,-1),g:0,s:rnd(5,15),a:0,life:rnd(260,420),age:0,rot:rnd(-.3,.3),c:HC[Math.floor(rnd(0,4))],drag:1,fadeIn:true});}
function petals(n){for(let i=0;i<(RM?4:n);i++)fx.push({shape:'petal',x:rnd(0,W),y:rnd(-60,-10),vx:rnd(.2,.9),vy:rnd(.7,1.7),g:0,s:rnd(5,10),a:.9,life:rnd(320,520),age:0,rot:rnd(0,6.28),vr:rnd(-.05,.05),c:PC[Math.floor(rnd(0,6))],drag:1,fadeIn:true});}
function loop(t){
  cx.clearRect(0,0,W,H);
  motes.forEach(d=>{d.x+=Math.sin(t/2200+d.p)*.14;d.y+=d.vy;if(d.y<-5){d.y=H+5;d.x=rnd(0,W);}cx.fillStyle=`rgba(${d.c},${d.a*(.6+.4*Math.sin(t/1400+d.p))})`;cx.beginPath();cx.arc(d.x,d.y,d.r,0,6.283);cx.fill();});
  lv.forEach((l,i)=>{l.y+=l.vy;l.x+=l.vx+Math.sin(t/900+l.p)*.5;l.rot+=l.vr;if(l.y>H+20||l.x>W+30)lv[i]=newLeaf(false);cx.save();cx.translate(l.x,l.y);cx.rotate(l.rot);cx.globalAlpha=l.a;cx.fillStyle=l.c;cx.beginPath();cx.moveTo(-l.s,0);cx.quadraticCurveTo(0,-l.s*.7,l.s,0);cx.quadraticCurveTo(0,l.s*.7,-l.s,0);cx.fill();cx.restore();});
  if(ambient&&!RM&&t-lastSpawn>1300){lastSpawn=t;fx.push({x:rnd(0,W),y:H+20,vx:rnd(-.15,.15),vy:rnd(-.7,-.35),g:0,s:rnd(5,10),a:0,life:900,age:0,rot:0,c:HC[Math.floor(rnd(0,4))],drag:1,fadeIn:true,amb:true});}
  for(let i=fx.length-1;i>=0;i--){const h=fx[i];h.age++;if(h.vr)h.rot+=h.vr;h.vx*=h.drag;h.vy=h.vy*h.drag+h.g;h.x+=h.vx+Math.sin(h.age/30+h.s)*(h.amb||h.fadeIn?.35:0);h.y+=h.vy;
    const k=h.age/h.life,al=h.fadeIn?Math.min(1,h.age/40)*(h.amb?.5:.9)*(1-Math.max(0,(k-.8)*5)):(1-k)*h.a;
    if(k>=1||h.y<-30){fx.splice(i,1);continue;}
    cx.save();cx.translate(h.x,h.y);cx.rotate(h.rot+Math.sin(h.age/40)*.1);cx.globalAlpha=Math.max(0,al);cx.fillStyle=h.c;
    if(h.shape==='star')starPath(h.s*(.65+.35*Math.sin(h.age/4)));else if(h.shape==='petal'){cx.beginPath();cx.ellipse(0,0,h.s,h.s*.5,0,0,6.283);}else heartPath(h.s);
    cx.fill();cx.restore();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Drifting blobs + growing olive vines ---------- */
[['#b1',40,-30],['#b2',-50,40],['#b3',30,50]].forEach(([id,x,y])=>{if(!RM)$(id).animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${x}vw,${y}vh) scale(1.2)`}],{duration:16000+Math.random()*6000,direction:'alternate',iterations:Infinity,easing:'ease-in-out'});});
function vine(svg,d,dur,delay){
  const st=mk('path',{d,class:'stem'});svg.appendChild(st);const len=st.getTotalLength();st.style.strokeDasharray=len;
  an(st,[{strokeDashoffset:len},{strokeDashoffset:0}],dur,{e:'ease-in-out',delay});
  for(let l=24,i=0;l<len-4;l+=16,i++){
    const p=st.getPointAtLength(l),q=st.getPointAtLength(l+1),a=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI,s=i%2?1:-1;
    const g=mk('g',{transform:`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${(a+s*52).toFixed(1)}) scale(${(.6+(i*37%10)/28).toFixed(2)})`});
    const lf=mk('path',{d:'M0 0C5 -10 22 -11 32 0C22 11 5 10 0 0Z',class:'leaf'+(i%4===1?' b':i%3===0?' l':'')});lf.style.transformOrigin='0 0';g.appendChild(lf);svg.appendChild(g);
    an(lf,[{transform:'scale(0)',opacity:0},{transform:'scale(1)',opacity:1}],1000,{delay:delay+l/len*dur*.92});
  }
}
function growVines(){['#vl svg','#vr svg'].forEach((s,i)=>{vine($(s),'M14 404C70 340 8 290 52 226C92 168 34 118 84 58C100 38 112 22 128 6',6500,i*900);vine($(s),'M14 404C40 360 70 350 96 316C120 286 110 250 138 226',4800,1400+i*900);});}

/* ---------- Timeline ---------- */
async function introLine(txt,hold){
  const el=$('#it');clearAn(el);el.style.display='';
  const b=build(el,txt,{cs:52,gap:110,lb:260});
  await reveal(b,1300,'translateY(112%) scale(.92)');await sleep(hold);
  await an(el,[{opacity:1,filter:'blur(0)',transform:'scale(1)'},{opacity:0,filter:'blur(12px)',transform:'scale(1.06)'}],1300,{e:'ease-in'});
}
async function say(txt,hold,em){ /* one full-screen message */
  const ms=$('#msgS'),m=$('#msg');clearAn(m);m.setAttribute('aria-label',txt.replace(/\n/g,' '));ms.classList.add('on');
  const b=build(m,txt,{em,cs:58,gap:150,lb:520});glow(m,b.total+2800);
  await reveal(b,1300);
  b.ems.forEach((p,i)=>{const l=p.getTotalLength();p.style.strokeDasharray=l;an(p,[{strokeDashoffset:l},{strokeDashoffset:0}],1500,{delay:i*500,e:'cubic-bezier(.65,0,.35,1)'});});
  wave(b);await sleep(hold);
  await an(m,[{opacity:1,filter:'blur(0)',transform:'scale(1)'},{opacity:0,filter:'blur(12px)',transform:'scale(.96) translateY(-18px)'}],1500,{e:'ease-in'});
  ms.classList.remove('on');clearAn(m);m.textContent='';await sleep(500);
}
async function run(){
  growVines();
  await an($('#gate'),[{opacity:1},{opacity:0}],1600,{e:'ease-in-out'});$('#gate').remove();await sleep(500);
  const intro=$('#intro');await show(intro);
  await introLine('Every love story\nbegins with a quiet moment.',1300);
  await introLine('finally i realise,\nami tmk cahra takte parbo na.....!',1600);
  await introLine('tmi amar senior hoilew,\namar moner sobcheye kache-r manush.',1900);
  $('#it').style.display='none';
  const hs=$('#hs');hs.style.display='block';
  an(hs,[{opacity:0,transform:'scale(.82)'},{opacity:1,transform:'scale(1)'}],1800);
  draw($('#r1'),3000);await draw($('#hp'),3200);
  an($('#hp'),[{fill:'rgba(168,203,230,0)'},{fill:'rgba(168,203,230,.6)'}],1500);
  const cap=$('#cap');await reveal(build(cap,'for lamu',{cs:110}),1200);await sleep(900);
  an(cap,[{opacity:1},{opacity:0}],1200,{e:'ease-in'});
  await an(hs,[{opacity:1,transform:'scale(1)',filter:'blur(0)'},{opacity:0,transform:'scale(1.8)',filter:'blur(12px)'}],1700,{e:'ease-in'});
  await hide(intro);await sleep(400);

  /* the messages */
  await say('tmk aro ekbar mone korai dei,\nvalobasle kintu biye korte hoi.',3800,['valobasle','biye']);
  await say('amar na tmk havvy valo lage,\ntmi na deika eto valo lage,',3800,['havvy']);
  await say('r dekle ki hoto? 🙈\nbhabei ami pagol hoye jai...',3800,['dekle']);
  await say('tmi ekdin na dekhle,\namar din-i shuru hoy na.',3500);
  await say('tmi shudhu "hmm" bolleo,\namar mon nachte thake. 💙',3500);
  await say('senior hoile ki hoise?\nvalobasha ki ar\nsenior-junior dekhe ashe?',4200,['valobasha']);
  await say('ami tmar junior-i thakbo,\nkintu tmar moner manush hote chai.',4000,['moner']);
  const sp=setInterval(()=>sparkle(W/2,H*.42,3,Math.min(W*.38,200)),450);
  await say('Ami amar ei bakita life\ntumar sathe katiye dite chai.',4200);
  clearInterval(sp);

  /* the question */
  ambient=true;
  const as=$('#askS'),a=$('#ask');await show(as);
  const q=build(a,'r u agree lamuuuu?',{cs:78,gap:200});glow(a,4200);
  await reveal(q,1500,'translateY(114%) scale(.88) rotate(6deg)');wave(q);await sleep(300);
  await an($('#btns'),[{opacity:0,transform:'translateY(26px)'},{opacity:1,transform:'none'}],1400);$('#btns').style.opacity=1;
}

/* ---------- Ring scene ---------- */
let ringTimers=[];
const clearRing=()=>{ringTimers.forEach(clearInterval);ringTimers=[];};
async function ringScene(){
  const ys=$('#yesS'),rs=$('#ringS'),ring=$('#ringg'),rt=$('#rt'),bk=$('#back'),halo=$('#hlo');
  await an(ys,[{opacity:1},{opacity:0}],1200,{e:'ease-in'});ys.classList.remove('on');clearAn(ys);
  clearRing();[ring,rt,bk,halo].forEach(clearAn);ring.style.opacity=0;halo.style.opacity=0;bk.style.opacity=0;rt.textContent='';
  await show(rs);
  petals(14);ringTimers.push(setInterval(()=>petals(5),1400),setInterval(()=>sparkle(rnd(0,W),rnd(H*.2,H*.9),3,40),1600));
  await sleep(600);
  ring.style.opacity=1;
  await an(ring,[{transform:'translateY(-170px) rotate(-50deg) scale(1.6)',opacity:0},{transform:'translateY(5px) rotate(8deg)',opacity:1,offset:.62},{transform:'translateY(-5px) rotate(-3deg)',offset:.78},{transform:'none',opacity:1}],2400);
  const r=ring.getBoundingClientRect();sparkle(r.left+r.width/2,r.top+r.height/2,22,40);burst();
  an(halo,[{opacity:0},{opacity:1}],1800);
  let b=build(rt,'Lamu, tmk amar kore nilam,\nforever. 💍',{cs:55,gap:160,lb:500});glow(rt,3200);
  await reveal(b,1300);wave(b);await sleep(2600);
  await an(rt,[{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(10px)'}],1200,{e:'ease-in'});
  clearAn(rt);b=build(rt,'Tumi amar, ami tomar,\nshesh nishash porjonto. 🤍',{cs:55,gap:160,lb:500});glow(rt,3200);rain();
  await reveal(b,1300);wave(b);
  await an(bk,[{opacity:0},{opacity:1}],1600,{delay:1500});
}

/* ---------- Yes / Nope ---------- */
let noCount=0,myName='',entryP=null;
const NOPE=['Hehe… are you sure? 🥺','Lamu, think again. My heart is listening 💗','That button looks shy. The other one looks very cute 👀','Error: “No” could not be found. Try the other one 🙈','Okay okay, I’ll wait. Forever. 😌','Still here, still hoping ❤️','Senior hoye junior er mon venge dibe? 🥺','Ek bar "Yes" bolo na, please… 🥹','Ami kintu ekdom serious, Lamu 💙'];
const hint=$('#hint'),yes=$('#yes'),no=$('#no');
function logAnswer(ans,count){if(!window.FB||!entryP)return;entryP.then(k=>k&&FB.answer(k,ans,count)).catch(e=>console.warn(e));}
no.onclick=()=>{
  const msg=NOPE[noCount%NOPE.length];noCount++;
  no.animate([{transform:'translateX(0) rotate(0)'},{transform:'translateX(-12px) rotate(-5deg)'},{transform:'translateX(10px) rotate(4deg)'},{transform:'translateX(0) rotate(0)'}],{duration:T(520),easing:EASE});
  no.style.setProperty('--g',Math.max(.8,1-noCount*.04));yes.style.setProperty('--g',Math.min(1.3,1+noCount*.05));
  logAnswer('nope',noCount);playNope();hint.textContent=msg;clearAn(hint);
  an(hint,[{opacity:0,transform:`translate(${noCount%2?18:-18}px,10px)`,filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0)'}],900);
};
yes.onclick=async()=>{
  yes.disabled=true;logAnswer('yes',noCount);burst();playYes();
  const as=$('#askS'),ys=$('#yesS');
  await an(as,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.06)'}],900,{e:'ease-in'});
  as.classList.remove('on');clearAn(as);
  setTimeout(rain,600);setTimeout(rain,2600);
  await show(ys);
  const hp=$('#hp2'),t=$('#ys'),b=build(t,'Hehe! I knew it, lamuuuu! ❤️',{cs:50,gap:180});
  await draw(hp,1800);an(hp,[{fill:'rgba(168,203,230,0)'},{fill:'rgba(111,163,203,.75)'}],1200);
  $('#hs2').animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:T(1500),iterations:Infinity,easing:'ease-in-out'});
  await reveal(b,1300);wave(b);await sleep(300);rain();
  const k=$('#kiss'),kb=build(k,'ummmmmmmmmmmmmah bou amar.',{cs:55,gap:160});glow(k,3200);
  await reveal(kb,1300);wave(kb);await sleep(3200);
  await ringScene();
};
$('#back').onclick=async()=>{
  const rs=$('#ringS'),as=$('#askS');
  stopYes();clearRing();
  await an(rs,[{opacity:1},{opacity:0}],700,{e:'ease-in'});rs.classList.remove('on');clearAn(rs);
  $('#rt').textContent='';{const k=$('#kiss');clearAn(k);k.textContent='';}clearAn($('#hs2'));
  hint.style.opacity=0;noCount=0;no.style.setProperty('--g',1);yes.style.setProperty('--g',1);yes.disabled=false;
  await show(as);
};

/* ---------- Name gate + Firebase log ---------- */
const nameIn=$('#nameIn'),beginBtn=$('#begin');
nameIn.addEventListener('input',()=>{myName=nameIn.value.trim();beginBtn.disabled=!myName;});
nameIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&myName)beginBtn.click();});
function logEntry(){
  if(!window.FB)return;
  const ua=navigator.userAgent,m=ua.match(/Android[^;]*;\s*([^;)]+?)\s*(?:Build|\))/);
  const device={model:m?m[1]:/iPhone/.test(ua)?'iPhone':/Windows/.test(ua)?'Windows PC':/Mac/.test(ua)?'Mac':'Unknown',screen:`${screen.width}x${screen.height} @${devicePixelRatio||1}x`,ua:ua.slice(0,220)};
  entryP=FB.enter(myName,device).catch(e=>{console.warn(e);return null;});
}
beginBtn.onclick=()=>{if(!myName)return;beginBtn.disabled=true;startSong();logEntry();run();};
})();
